<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Walkie Talkie MELANTIA - Modos Comunidad</title>
    <style>
      body {
        background: #f7fafc;
        font-family: sans-serif;
      }
      #walkie-container {
        max-width: 420px;
        margin: 30px auto;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        background: #fff;
        box-shadow: 0 2px 8px #0001;
      }
      #modo-selector {
        margin-bottom: 18px;
      }
      #normas-grupal {
        background: #fefcbf;
        color: #744210;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
        border: 1px solid #f6e05e;
        font-size: 14px;
      }
      #mensajes-lista,
      #audios-lista {
        margin-bottom: 15px;
        min-height: 40px;
        background: #f9fafb;
        border-radius: 6px;
        padding: 8px;
        border: 1px solid #e2e8f0;
        font-size: 15px;
        max-height: 120px;
        overflow-y: auto;
      }
      #mensaje-input,
      #destinatario-input {
        width: 60%;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        margin-right: 5px;
      }
      #enviar-mensaje,
      #push-to-talk {
        padding: 7px 12px;
        border-radius: 6px;
        border: none;
        background: #3182ce;
        color: #fff;
        margin-right: 5px;
        cursor: pointer;
      }
      #push-to-talk {
        background: #ed8936;
      }
      #destinatario-input {
        width: 35%;
      }
    </style>
  </head>
  <body>
    <div id="walkie-container">
      <div id="modo-selector">
        <label
          ><input type="radio" name="modo" value="grupal" checked /> Modo
          Grupal/SOS</label
        >
        <label style="margin-left: 20px"
          ><input type="radio" name="modo" value="privado" /> Modo
          Privado</label
        >
      </div>
      <div id="normas-grupal" style="display: block">
        <b>Normas del canal grupal/SOS:</b><br />
        - Prohibido usar para propaganda política o insultos.<br />
        - Don Eloy modera y puede bloquear mensajes ofensivos.<br />
        - El canal es público, todos pueden escuchar.<br />
      </div>
      <div id="destinatario-privado" style="display: none; margin-bottom: 10px">
        <input
          id="destinatario-input"
          type="text"
          placeholder="Usuario destinatario (amigo)"
        />
      </div>
      <div id="mensajes-lista"></div>
      <input
        id="mensaje-input"
        type="text"
        placeholder="Escribe un mensaje..."
      />
      <button id="enviar-mensaje">Enviar</button>
      <button id="push-to-talk">🎤 Push to Talk</button>
      <div id="audios-lista"></div>
    </div>
    <script src="walkie_talkie.js"></script>
    <script>
      // --- Lógica de modos ---
      const walkie = new WalkieTalkie();
      let modo = 'grupal';
      let usuario =
        prompt('¿Cuál es tu nombre o alias en la comunidad?', 'Yo') || 'Yo';

      function renderMensajes() {
        const lista = document.getElementById('mensajes-lista');
        lista.innerHTML = walkie
          .obtenerMensajes()
          .map(
            (m) =>
              `<div><b>${m.autor}${m.destinatario ? ' → ' + m.destinatario : ''}:</b> ${m.texto}</div>`
          )
          .join('');
      }
      function renderAudios() {
        const lista = document.getElementById('audios-lista');
        lista.innerHTML = walkie
          .obtenerAudios()
          .map(
            (a, idx) =>
              `<div><b>${a.autor}${a.destinatario ? ' → ' + a.destinatario : ''}:</b> <audio src="${a.blobUrl}" controls onplay="marcarEscuchado(${idx})"></audio></div>`
          )
          .join('');
      }
      // --- Moderación Don Eloy ---
      function contienePalabrasProhibidas(texto) {
        const prohibidas = [
          'política',
          'elección',
          'voto',
          'partido',
          'insulto',
          'idiota',
          'tonto',
          'estúpido',
          'ofensa',
          'grosero',
          'maldito',
          'carajo',
          'mierda',
          'imbécil',
          'puto',
          'puta',
          'propaganda',
          'campaña',
          'candidato',
          'presidente',
          'alcalde',
          'concejal',
          'diputado',
          'senador',
          'asambleísta',
          'gobierno',
          'corrupción',
          'corrupto',
          'ladrón',
          'ladrona',
          'delincuente',
          'delincuencia',
          'odio',
          'racista',
          'discriminar',
          'discriminación',
        ];
        const textoLimpio = texto.toLowerCase();
        return prohibidas.some((p) => textoLimpio.includes(p));
      }

      function alertaDonEloy(mensaje) {
        const normas = document.getElementById('normas-grupal');
        normas.style.background = '#feb2b2';
        normas.style.color = '#742a2a';
        normas.innerHTML =
          '<b>⚠️ Don Eloy:</b> ' +
          mensaje +
          '<br>Recuerda las normas del canal grupal.';
        setTimeout(() => {
          normas.style.background = '#fefcbf';
          normas.style.color = '#744210';
          normas.innerHTML =
            '<b>Normas del canal grupal/SOS:</b><br>- Prohibido usar para propaganda política o insultos.<br>- Don Eloy modera y puede bloquear mensajes ofensivos.<br>- El canal es público, todos pueden escuchar.<br>';
        }, 6000);
      }

      document.getElementById('enviar-mensaje').onclick = () => {
        const input = document.getElementById('mensaje-input');
        let destinatario = null;
        if (modo === 'privado') {
          destinatario = document
            .getElementById('destinatario-input')
            .value.trim();
          if (!destinatario) {
            alert('Debes indicar el destinatario.');
            return;
          }
        }
        // Moderación solo en modo grupal
        if (modo === 'grupal' && contienePalabrasProhibidas(input.value)) {
          alertaDonEloy('Mensaje bloqueado por contenido ofensivo o político.');
          input.value = '';
          return;
        }
        walkie.agregarMensaje(input.value, usuario, destinatario);
        input.value = '';
        renderMensajes();
      };
      document.getElementById('push-to-talk').onclick = async () => {
        let destinatario = null;
        if (modo === 'privado') {
          destinatario = document
            .getElementById('destinatario-input')
            .value.trim();
          if (!destinatario) {
            alert('Debes indicar el destinatario.');
            return;
          }
        }
        // Moderación solo en modo grupal: bloquear si el usuario escribe palabra prohibida en el input antes de grabar
        const input = document.getElementById('mensaje-input');
        if (modo === 'grupal' && contienePalabrasProhibidas(input.value)) {
          alertaDonEloy(
            'Audio bloqueado por contenido ofensivo o político en el mensaje asociado.'
          );
          input.value = '';
          return;
        }
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
        });
        const recorder = new MediaRecorder(stream);
        let chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(blob);
          walkie.agregarAudio(url, usuario, destinatario);
          renderAudios();
        };
        recorder.start();
        setTimeout(() => recorder.stop(), 3000);
      };
      window.marcarEscuchado = (idx) => {
        const audio = walkie.obtenerAudios()[idx];
        walkie.marcarAudioEscuchado(audio);
        setTimeout(() => {
          walkie.limpiarAudiosViejos();
          renderAudios();
        }, 30000);
      };
      // Cambiar modo
      document.querySelectorAll('input[name="modo"]').forEach((radio) => {
        radio.onchange = (e) => {
          modo = e.target.value;
          document.getElementById('normas-grupal').style.display =
            modo === 'grupal' ? 'block' : 'none';
          document.getElementById('destinatario-privado').style.display =
            modo === 'privado' ? 'block' : 'none';
        };
      });
      // Extiende WalkieTalkie para soportar destinatario
      WalkieTalkie.prototype.agregarMensaje = function (
        texto,
        autor,
        destinatario = null
      ) {
        if (this.mensajes.length >= this.maxMensajes) {
          this.mensajes.shift();
        }
        this.mensajes.push({
          texto,
          autor,
          destinatario,
          timestamp: Date.now(),
        });
      };
      WalkieTalkie.prototype.agregarAudio = function (
        blobUrl,
        autor,
        destinatario = null
      ) {
        const audio = {
          blobUrl,
          autor,
          destinatario,
          timestamp: Date.now(),
          escuchado: false,
          timestampEscucha: null,
        };
        this.audios.push(audio);
        return audio;
      };
      renderMensajes();
      renderAudios();
    </script>
  </body>
</html>
