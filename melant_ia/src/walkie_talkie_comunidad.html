<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Walkie Talkie - Comunidad Virtual MELANTIA</title>
    <style>
      #walkie-container {
        max-width: 400px;
        margin: 30px auto;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        background: #f9fafb;
        box-shadow: 0 2px 8px #0001;
      }
      #mensajes-lista,
      #audios-lista {
        margin-bottom: 15px;
        min-height: 40px;
        background: #fff;
        border-radius: 6px;
        padding: 8px;
        border: 1px solid #e2e8f0;
        font-size: 15px;
        max-height: 120px;
        overflow-y: auto;
      }
      #mensaje-input {
        width: 70%;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        margin-right: 5px;
      }
      #enviar-mensaje,
      #push-to-talk {
        padding: 7px 12px;
        border-radius: 6px;
        border: none;
        background: #3182ce;
        color: #fff;
        margin-right: 5px;
        cursor: pointer;
      }
      #push-to-talk {
        background: #ed8936;
      }
    </style>
  </head>
  <body>
    <div id="walkie-container">
      <div id="mensajes-lista"></div>
      <input
        id="mensaje-input"
        type="text"
        placeholder="Escribe un mensaje..."
      />
      <button id="enviar-mensaje">Enviar</button>
      <button id="push-to-talk">🎤 Push to Talk</button>
      <div id="audios-lista"></div>
    </div>
    <script src="walkie_talkie.js"></script>
    <script>
      // --- Integración básica ---
      const walkie = new WalkieTalkie();
      function renderMensajes() {
        const lista = document.getElementById('mensajes-lista');
        lista.innerHTML = walkie
          .obtenerMensajes()
          .map((m) => `<div><b>${m.autor}:</b> ${m.texto}</div>`)
          .join('');
      }
      function renderAudios() {
        const lista = document.getElementById('audios-lista');
        lista.innerHTML = walkie
          .obtenerAudios()
          .map(
            (a, idx) =>
              `<div><b>${a.autor}:</b> <audio src="${a.blobUrl}" controls onplay="marcarEscuchado(${idx})"></audio></div>`
          )
          .join('');
      }
      document.getElementById('enviar-mensaje').onclick = () => {
        const input = document.getElementById('mensaje-input');
        if (input.value.trim()) {
          walkie.agregarMensaje(input.value, 'Yo');
          input.value = '';
          renderMensajes();
        }
      };
      document.getElementById('push-to-talk').onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
        });
        const recorder = new MediaRecorder(stream);
        let chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(blob);
          walkie.agregarAudio(url, 'Yo');
          renderAudios();
        };
        recorder.start();
        setTimeout(() => recorder.stop(), 3000); // 3 segundos
      };
      window.marcarEscuchado = (idx) => {
        const audio = walkie.obtenerAudios()[idx];
        walkie.marcarAudioEscuchado(audio);
        setTimeout(() => {
          walkie.limpiarAudiosViejos();
          renderAudios();
        }, 30000); // 30 segundos
      };
      renderMensajes();
      renderAudios();
    </script>
  </body>
</html>
